name: CiteGlance 每日检索

on:
  schedule:
    - cron: '7 9 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 仅检索并预览，不发送 Telegram
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-paper-watch
  cancel-in-progress: false

jobs:
  track:
    if: ${{ github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || vars.PAPER_WATCH_CLOUD_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 检索并生成简报
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_WATCH_DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUTF8: '1'
        run: python3 bot.py --previous-day
