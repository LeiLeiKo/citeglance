name: 每日论文追踪

on:
  schedule:
    - cron: '7 9 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 仅检索并预览，不发送 Telegram
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-paper-watch
  cancel-in-progress: false

jobs:
  track:
    if: ${{ github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || vars.PAPER_WATCH_CLOUD_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: 检索并生成简报
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_WATCH_DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUTF8: '1'
        run: python3 bot.py
      - name: 保存去重记录和检索进度
        if: ${{ !cancelled() && inputs.dry_run != true }}
        shell: bash
        run: |
          git add state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update paper watch state'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
